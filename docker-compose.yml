# Runs on the EC2 host. The database is RDS, not a container — a managed
# Postgres gives you backups, patching and point-in-time restore, none of
# which a container on the same box would survive losing.
#
# Secrets live in ONE file on the host: `.env`, copied from
# .env.production.example. It has to be named `.env` because Compose only
# interpolates ${VARS} in THIS file from `.env` (or --env-file) — `env_file:`
# below feeds the container at runtime and does nothing for the build args.
# Split them across two names and NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is baked
# into the image as an empty string, and the app 500s on every page.

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: algopath:latest
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        # started, not healthy: the app's healthcheck queries the database, so
        # a bad DATABASE_URL would keep nginx from ever starting and you would
        # get a connection refused instead of a page telling you what broke.
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
