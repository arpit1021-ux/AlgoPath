# Reverse proxy for AlgoPath. Start on HTTP only; uncomment the TLS server
# block after certbot has issued a certificate (see docs/DEPLOYMENT.md).

upstream algopath {
    server app:3000;
    keepalive 32;
}

# Send `Connection: upgrade` only for requests that actually are one. Setting
# it unconditionally sends it on every ordinary request too, which defeats the
# keepalive pool above — nginx cannot reuse a connection it just told the
# upstream to upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # ACME challenge must stay on plain HTTP for certbot renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- after TLS is issued, replace the block below with this redirect ---
    # location / { return 301 https://$host$request_uri; }

    client_max_body_size 2m;

    location / {
        proxy_pass         http://algopath;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Roadmap generation can run for a while; the default 60s would cut it.
        proxy_read_timeout 120s;
    }

    # Next.js fingerprints these filenames, so they are safe to cache hard.
    location /_next/static/ {
        proxy_pass http://algopath;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

